<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .mark-dark { stroke: #1a1612; }
    .mark-accent { stroke: #c4622d; }
    @media (prefers-color-scheme: dark) {
      .mark-dark { stroke: #f5f0e8; }
    }
  </style>
  <defs>
    <mask id="spine-cutout">
      <rect width="100" height="100" fill="white" />
      <path d="M50 20 L 50 80" stroke="black" stroke-width="16" stroke-linecap="round" />
    </mask>
  </defs>
  <path class="mark-dark" d="M25 80 L 50 20" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark-dark" d="M50 20 L 50 80" stroke-width="8" stroke-linecap="round"/>
  <path class="mark-dark" d="M35 55 L 50 55" stroke-width="8" stroke-linecap="round"/>
  <g mask="url(#spine-cutout)">
    <path class="mark-accent" d="M50 55 L 75 25" stroke-width="8" stroke-linecap="round"/>
    <path class="mark-accent" d="M50 55 L 75 80" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
